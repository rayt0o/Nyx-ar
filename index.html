<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Nyx AR · Editorial TRAMA</title>
<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-v1.5.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
@font-face{font-family:Catt;src:url(fonts/Cattedrale-Demo-Regular.ttf)}
@font-face{font-family:Cush;src:url(fonts/LTCushion-Medium.ttf);font-weight:500}
@font-face{font-family:Cush;src:url(fonts/LTCushion-Black.ttf);font-weight:900}
html,body{margin:0;height:100%;overflow:hidden;font-family:Cush,system-ui,sans-serif}
/* el fondo va solo en html: si el body tiene fondo, tapa el video de la cámara (MindAR lo pone detrás con z-index negativo) */
html{background:#181B1C}
body{background:transparent}
#intro{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;color:#fff;background:radial-gradient(circle at 50% 40%,#590FBC 0,#2a0a5a 55%,#181B1C 100%)}
#intro img{width:64px}
#intro h1{font:400 64px/1 Catt;margin:0}
#intro p{font-weight:500;font-size:16px;line-height:1.45;max-width:320px;margin:0;opacity:.9}
#intro button{font:900 15px Cush;letter-spacing:.14em;color:#181B1C;background:#00E1FF;border:0;border-radius:999px;padding:16px 30px}
#msg{position:fixed;left:16px;right:16px;bottom:24px;z-index:20;display:none;background:#00E1FF;color:#181B1C;font-weight:500;font-size:15px;line-height:1.45;padding:16px 18px;border-radius:6px}
#hint{position:fixed;left:0;right:0;bottom:22px;z-index:5;text-align:center;color:#fff;font-weight:900;font-size:13px;letter-spacing:.14em;text-shadow:0 1px 4px #000;display:none}
</style>
</head>
<body>
<div id="intro">
  <img src="isotipo.png" alt="">
  <h1>Nyx</h1>
  <p>Apunta la cámara a la carta 001 de Nyx y espera a que salga de ella.</p>
  <button id="go">ABRIR LA CÁMARA</button>
</div>
<div id="hint">APUNTA A LA CARTA</div>
<div id="msg"></div>

<a-scene id="scene" mindar-image="imageTargetSrc: carta-nyx.mind; autoStart: false; uiLoading: no; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001"
  color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-assets><a-asset-item id="nyx" src="nyx.glb"></a-asset-item></a-assets>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity light="type: ambient; intensity: 1.2"></a-entity>
  <a-entity light="type: directional; intensity: 2.2" position="0.5 1 1.5"></a-entity>
  <a-entity light="type: directional; color: #00E1FF; intensity: 0.8" position="-1 0.5 -1"></a-entity>
  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <!-- Nyx sale de la carta: de pie sobre el plano de la carta -->
    <a-entity rotation="90 0 0" position="0 -0.15 0">
      <a-entity id="pop" scale="0.001 0.001 0.001"
        animation__in="property: scale; to: 0.085 0.085 0.085; dur: 900; easing: easeOutBack; startEvents: aparece"
        animation__out="property: scale; to: 0.001 0.001 0.001; dur: 250; startEvents: desaparece">
        <a-entity gltf-model="#nyx"
          animation__flota="property: position; from: 0 0 0; to: 0 0.6 0; dir: alternate; loop: true; dur: 1800; easing: easeInOutSine"
          animation__gira="property: rotation; from: 0 -25 0; to: 0 25 0; dir: alternate; loop: true; dur: 4200; easing: easeInOutSine"></a-entity>
      </a-entity>
    </a-entity>
  </a-entity>
</a-scene>

<script>
const scene=document.getElementById('scene'),pop=document.getElementById('pop'),hint=document.getElementById('hint'),t=document.getElementById('target');
const msg=document.getElementById('msg');
function aviso(t){msg.innerHTML=t;msg.style.display='block';hint.style.display='none';}
const ua=navigator.userAgent||'';
if(/Instagram|FBAN|FBAV|WhatsApp|Line\/|TikTok/i.test(ua)){
  aviso('Estás en el navegador de una app. Toca los <b>tres puntos</b> y elige <b>"Abrir en el navegador"</b> (Chrome o Safari).');
}
document.getElementById('go').addEventListener('click',async()=>{
  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    aviso('Este navegador no permite la cámara aquí. Abre el enlace en <b>Chrome</b> (Android) o <b>Safari</b> (iPhone).');return;
  }
  // Pedir el permiso primero, con el toque del usuario (más confiable en iPhone)
  try{
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    st.getTracks().forEach(t=>t.stop());
  }catch(e){
    if(e.name==='NotAllowedError'||e.name==='SecurityError'){
      aviso('La cámara está <b>bloqueada</b> para esta página.<br><br><b>Android:</b> toca el candado junto a la dirección → Permisos → Cámara → Permitir, y recarga.<br><b>iPhone:</b> Ajustes → Safari → Cámara → Permitir, y recarga.');
    }else if(e.name==='NotFoundError'||e.name==='OverconstrainedError'){
      aviso('No se encontró una cámara en este dispositivo.');
    }else if(e.name==='NotReadableError'){
      aviso('Otra app está usando la cámara. Ciérrala y vuelve a intentar.');
    }else{ aviso('No se pudo abrir la cámara ('+e.name+'). Recarga la página e inténtalo de nuevo.'); }
    return;
  }
  document.getElementById('intro').style.display='none'; hint.style.display='block'; hint.textContent='CARGANDO CÁMARA…';
  const start=()=>scene.systems['mindar-image-system'].start();
  scene.hasLoaded?start():scene.addEventListener('loaded',start);
});
scene.addEventListener('arReady',()=>{hint.textContent='APUNTA A LA CARTA';});
scene.addEventListener('arError',()=>{aviso('No se pudo iniciar la cámara. Recarga la página y vuelve a tocar <b>ABRIR LA CÁMARA</b>.');});
t.addEventListener('targetFound',()=>{hint.style.display='none';pop.emit('aparece');});
t.addEventListener('targetLost',()=>{hint.style.display='block';pop.emit('desaparece');});
</script>
</body>
</html>
